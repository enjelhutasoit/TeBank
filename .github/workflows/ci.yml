name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: SwiftPM tests (Xcode 16.2)
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Determine verification scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          full=true
          smoke=true
          # An unavailable base (for example, a multi-commit push) gets full CI.
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null &&
             git diff --quiet "$BASE_SHA" HEAD -- . ':(exclude,top)README.md'; then
            full=false
            smoke=false
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] &&
               git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null &&
               git diff --quiet "$BASE_SHA" HEAD -- . ':(exclude,top)README.md' \
                 ':(exclude,top)Sources/TeBankCore/**' ':(exclude,top)Tests/TeBankCoreTests/**'; then
            smoke=false
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"
          echo "Package tests and iOS build: $full. Simulator launch: $smoke." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify pinned toolchain
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error::Missing pinned Xcode at $DEVELOPER_DIR"
            exit 1
          fi

          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          if [[ "$version" != $'Xcode 16.2\nBuild version 16C5032a' ]]; then
            echo "::error::Expected Xcode 16.2 build 16C5032a"
            exit 1
          fi

          xcrun swift --version

      - name: Test Swift package
        if: steps.scope.outputs.full == 'true'
        run: xcrun swift test --disable-automatic-resolution -Xswiftc -warnings-as-errors

      - name: Ensure Xcode 16.2 has an iOS simulator destination
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          destinations=$(xcodebuild -project TeBank.xcodeproj -scheme TeBank -showdestinations)
          if ! awk '/Ineligible destinations/ { exit } /platform:iOS Simulator,/ { found=1 } END { exit !found }' <<< "$destinations"; then
            printf '%s\n' "$destinations"
            xcodebuild -downloadPlatform iOS
          fi

      - name: Build the iOS shell
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project TeBank.xcodeproj -scheme TeBank -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TeBankBuild" CODE_SIGNING_ALLOWED=NO build

      - name: Test onboarding approval and dashboard on iOS
        if: steps.scope.outputs.smoke == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Use the runner Xcode that owns the installed simulator runtime.
          unset DEVELOPER_DIR
          xcodebuild -version
          destinations=$(xcodebuild -project TeBank.xcodeproj -scheme TeBank -showdestinations)
          device_id=$(python3 -c 'import re, sys
          eligible = sys.stdin.read().split("Ineligible destinations")[0]
          for line in eligible.splitlines():
              if "platform:iOS Simulator," in line and "name:iPhone" in line:
                  match = re.search(r"id:\s*([0-9A-Fa-f-]{36})", line)
                  if match:
                      print(match.group(1))
                      break
          else:
              sys.exit("No eligible iPhone simulator for the runner Xcode")' <<< "$destinations")
          xcodebuild -project TeBank.xcodeproj -scheme TeBank -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/TeBankUITests" -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO test
