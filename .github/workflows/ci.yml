name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: SwiftPM tests (Xcode 16.2)
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify pinned toolchain
        shell: bash
        run: |
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error::Missing pinned Xcode at $DEVELOPER_DIR"
            exit 1
          fi

          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          if [[ "$version" != $'Xcode 16.2\nBuild version 16C5032a' ]]; then
            echo "::error::Expected Xcode 16.2 build 16C5032a"
            exit 1
          fi

          xcrun swift --version

      - name: Test Swift package
        run: xcrun swift test --disable-automatic-resolution -Xswiftc -warnings-as-errors

      - name: Build and launch the iOS shell
        shell: bash
        run: |
          set -euo pipefail
          devices=$(xcrun simctl list devices available -j)
          device_id=$(python3 -c 'import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, group in devices.items()
                     if ".iOS-18-2" in runtime for d in group
                     if d["name"].startswith("iPhone")))' <<< "$devices")
          xcodebuild -project TeBank.xcodeproj -scheme TeBank -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$RUNNER_TEMP/TeBankBuild" CODE_SIGNING_ALLOWED=NO build
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" "$RUNNER_TEMP/TeBankBuild/Build/Products/Debug-iphonesimulator/TeBank.app"
          xcrun simctl launch "$device_id" dev.tebank.prototype
