name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine verification scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      smoke: ${{ steps.scope.outputs.smoke }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Determine verification scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          full=true
          smoke=true
          # An unavailable base (for example, a multi-commit push) gets full CI.
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null &&
             git diff --quiet "$BASE_SHA" HEAD -- . ':(exclude,glob)**/*.md'; then
            full=false
            smoke=false
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] &&
               git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null &&
               git diff --quiet "$BASE_SHA" HEAD -- . ':(exclude,glob)**/*.md' \
                 ':(exclude,top)Sources/TeBankCore/**' ':(exclude,top)Tests/TeBankCoreTests/**'; then
            smoke=false
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"
          echo "Package tests and iOS build: $full. Simulator UI test: $smoke." >> "$GITHUB_STEP_SUMMARY"

  package-tests:
    name: Run Swift package tests
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify pinned toolchain
        shell: bash
        run: |
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error::Missing pinned Xcode at $DEVELOPER_DIR"
            exit 1
          fi

          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          if [[ "$version" != $'Xcode 16.2\nBuild version 16C5032a' ]]; then
            echo "::error::Expected Xcode 16.2 build 16C5032a"
            exit 1
          fi

          xcrun swift --version

      - name: Test Swift package
        shell: bash
        run: |
          set -euo pipefail
          started_at=$SECONDS
          trap 'printf "SwiftPM build and tests: %s s\n" "$((SECONDS-started_at))" >> "$GITHUB_STEP_SUMMARY"' EXIT
          xcrun swift test --disable-automatic-resolution -Xswiftc -warnings-as-errors

  ios:
    name: Verify iOS app
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build the iOS shell
        if: needs.scope.outputs.smoke != 'true'
        shell: bash
        run: |
          set -euo pipefail
          started_at=$SECONDS
          trap 'printf "iOS build: %s s\n" "$((SECONDS-started_at))" >> "$GITHUB_STEP_SUMMARY"' EXIT
          xcodebuild -version
          xcodebuild -project TeBank.xcodeproj -scheme TeBank -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TeBankBuild" CODE_SIGNING_ALLOWED=NO build

      - name: Select and prepare simulator
        id: simulator
        if: needs.scope.outputs.smoke == 'true'
        shell: bash
        run: |
          set -euo pipefail
          started_at=$SECONDS
          trap 'printf "Simulator selection and boot: %s s\n" "$((SECONDS-started_at))" >> "$GITHUB_STEP_SUMMARY"' EXIT
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
          architecture=$(uname -m)
          devices=$(xcrun simctl list devices available -j)
          device_id=$(python3 -c 'import json, sys
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-" + sys.argv[1].replace(".", "-")
          devices = json.load(sys.stdin)["devices"].get(runtime, [])
          device = next((item for item in devices if item["name"].startswith("iPhone")), None)
          if device is None:
              sys.exit(f"No preinstalled iPhone simulator for iOS {sys.argv[1]}")
          print(device["udid"])' "$sdk_version" <<< "$devices")
          xcrun simctl bootstatus "$device_id" -b
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
          echo "architecture=$architecture" >> "$GITHUB_OUTPUT"

      - name: Test onboarding approval and dashboard on iOS
        if: needs.scope.outputs.smoke == 'true'
        shell: bash
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.device_id }}
          SIMULATOR_ARCH: ${{ steps.simulator.outputs.architecture }}
        run: |
          set -euo pipefail
          started_at=$SECONDS
          trap 'printf "Simulator build and tests: %s s\n" "$((SECONDS-started_at))" >> "$GITHUB_STEP_SUMMARY"' EXIT
          xcodebuild -showBuildTimingSummary -project TeBank.xcodeproj -scheme TeBank -configuration Debug \
            -resultBundlePath "$RUNNER_TEMP/dashboard.xcresult" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=$SIMULATOR_ARCH" \
            -derivedDataPath "$RUNNER_TEMP/TeBankUITests" -parallel-testing-enabled NO \
            ARCHS="$SIMULATOR_ARCH" CODE_SIGNING_ALLOWED=NO test

      - name: Preserve failed dashboard UI test evidence
        if: failure() && needs.scope.outputs.smoke == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-ui-failure
          path: ${{ runner.temp }}/dashboard.xcresult
          retention-days: 1
          if-no-files-found: ignore

  verification:
    # Preserve the existing required check across all verification scopes.
    name: SwiftPM tests (Xcode 16.2)
    needs: [scope, package-tests, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check verification results
        shell: bash
        env:
          SCOPE: ${{ needs.scope.result }}
          FULL: ${{ needs.scope.outputs.full }}
          PACKAGE: ${{ needs.package-tests.result }}
          IOS: ${{ needs.ios.result }}
        run: |
          set -eu
          [[ "$SCOPE" == success ]]
          case "$FULL" in
            true)  [[ "$PACKAGE" == success && "$IOS" == success ]] ;;
            false) [[ "$PACKAGE" == skipped && "$IOS" == skipped ]] ;;
            *) exit 1 ;;
          esac
